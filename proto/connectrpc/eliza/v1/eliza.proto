// Eliza service — copied from buf's connectrpc/eliza-protos demo.
// Used here only to drive the FE example against demo.connectrpc.com.
syntax = "proto3";

package connectrpc.eliza.v1;

service ElizaService {
  rpc Say(SayRequest) returns (SayResponse) {}
  rpc Introduce(IntroduceRequest) returns (stream IntroduceResponse) {}
}

message SayRequest {
  string sentence = 1;
}

message SayResponse {
  string sentence = 1;
}

message IntroduceRequest {
  string name = 1;
}

message IntroduceResponse {
  string sentence = 1;
}
