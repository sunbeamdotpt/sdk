// Internal DNS — the operator-facing front over dns-0's PowerDNS REST API
// (:8081). iapi is the ONLY caller of the PDNS API; this service is the
// wrapper workflows use (W1 step 11, W2 step 2/teardown) plus direct
// operator CRUD.
//
// Zone lifecycle follows RFC 0002 §4.1: every VPC owns its subdomain;
// public zones add DNSSEC (cryptokeys managed here; DS-at-parent publish
// stays a reviewed manual step — no unsigned window, ever).
//
// Auth: Keto object = zone/record id; verbs
// iapi/dns/<resource>/<verb>.

syntax = "proto3";

package sunbeam.iapi.v1;

import "google/protobuf/timestamp.proto";

option java_package = "eu.sunbeamlabs.iapi.v1";
option java_multiple_files = true;
option go_package = "github.com/sunbeamdotpt/iapi;iapiv1";

service DnsService {
  rpc CreateZone(CreateZoneRequest) returns (Zone);
  rpc GetZone(GetZoneRequest) returns (Zone);
  rpc ListZones(ListZonesRequest) returns (stream Zone);
  rpc DeleteZone(DeleteZoneRequest) returns (Zone);

  // Upsert of a whole rrset (PDNS rrset PATCH is whole-rrset replacement;
  // iapi does read-modify-write under the hood and is the sole client, so
  // no lost updates).
  rpc SetRecord(SetRecordRequest) returns (Record);
  rpc GetRecord(GetRecordRequest) returns (Record);
  rpc ListRecords(ListRecordsRequest) returns (stream Record);
  rpc DeleteRecord(DeleteRecordRequest) returns (Record);

  // RFC 2136 TSIG keys for cert-manager DNS-01 renewals — one per consumer.
  rpc CreateTsigKey(CreateTsigKeyRequest) returns (TsigKey);
  rpc ListTsigKeys(ListTsigKeysRequest) returns (stream TsigKey);
  rpc DeleteTsigKey(DeleteTsigKeyRequest) returns (TsigKey);
}

message Zone {
  string id = 1;
  // Zone origin, e.g. "alpha.labs.cdg.sunbeam.pt."
  string origin = 2;
  string tenant_id = 3;
  bool internal = 4; // true = dns-0 internal tree; false = public delegated
  // Public zones only: DNSSEC enabled (CSK, ECDSAP256SHA256, NSEC).
  bool dnssec = 5;
  // Apex NS records are set at creation (runbook §9.3: a zone without an
  // apex NS misbehaves) — readiness reported here.
  bool apex_ns_verified = 6;
  // For public zones: slave AXFR consistency verified (ns1/ns2).
  bool propagated = 7;
  google.protobuf.Timestamp create_time = 8;
  google.protobuf.Timestamp update_time = 9;
  // Zones are served by the region's dns-0.
  string region_code = 10;
}

message Record {
  string id = 1;
  string zone_id = 2;
  // Full name within the zone.
  string name = 3;
  RecordType type = 4;
  int32 ttl_seconds = 5;
  repeated string values = 6;
  google.protobuf.Timestamp create_time = 7;
  google.protobuf.Timestamp update_time = 8;
}

enum RecordType {
  RECORD_TYPE_UNSPECIFIED = 0;
  RECORD_TYPE_A = 1;
  RECORD_TYPE_AAAA = 2;
  RECORD_TYPE_CNAME = 3;
  RECORD_TYPE_TXT = 4;
  RECORD_TYPE_MX = 5;
  RECORD_TYPE_NS = 6;
  RECORD_TYPE_SRV = 7;
}

message TsigKey {
  string id = 1;
  string name = 2;
  string algorithm = 3; // e.g. hmac-sha256
  // The key secret is write-only in responses (empty on read).
  string key = 4;
  google.protobuf.Timestamp create_time = 5;
}

message CreateZoneRequest {
  string origin = 1;
  bool internal = 2;
  bool dnssec = 3;
  string idempotency_key = 4;
  // Which region's dns-0 serves the zone; optional while one region is
  // ACTIVE.
  string region = 5;
}

message GetZoneRequest {
  string id = 1;
}

message ListZonesRequest {
  bool internal_only = 1; // optional filter
}

message DeleteZoneRequest {
  string id = 1;
}

message SetRecordRequest {
  string zone_id = 1;
  string name = 2;
  RecordType type = 3;
  int32 ttl_seconds = 4;
  repeated string values = 5;
  string idempotency_key = 6;
}

message GetRecordRequest {
  string id = 1;
}

message ListRecordsRequest {
  string zone_id = 1; // optional filter
  RecordType type = 2;
}

message DeleteRecordRequest {
  string id = 1;
}

message CreateTsigKeyRequest {
  reserved 1;
  string name = 2;
  string algorithm = 3;
}

message ListTsigKeysRequest {}

message DeleteTsigKeyRequest {
  string id = 1;
}
