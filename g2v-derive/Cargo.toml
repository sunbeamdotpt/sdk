[package]
name = "sunbeam-g2v-derive"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sunbeamdotpt/sdk"
publish = false
description = "Proc-macro derive for the vendored g2v framework (Instrumented)"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
Inflector = "0.11"

[lints]
workspace = true
